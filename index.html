<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BurgerHouse | Bestell-App</title>
        <link rel="icon" href="./assets/icons/favicon.svg" />

        <script src="./scripts/meals.js"></script>
        <script src="./scripts/templates.js"></script>
        <script src="./script.js"></script>

        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body onload="init()" id="page_top">
        <header class="page_header">
            <div class="content_wrapper header_content">
                <a href="./index.html">
                    <img
                        class="bestellapp_logo"
                        src="./assets/icons/bestellapp_logo.svg"
                        alt="Bestell-App Startseite"
                    />
                </a>
                <!-- placeholder without function, see Figma note -->
                <img
                    class="menu_icon"
                    src="./assets/icons/menu_dummy.svg"
                    alt=""
                />
            </div>
        </header>

        <main>
            <section aria-labelledby="restaurant_name">
                <div class="hero">
                    <img
                        class="hero_desktop"
                        src="./assets/img/burgerhouse_titelbild_desktop.webp"
                        alt="Burger, Pizza, Pasta und Salat auf einem Holztisch"
                    />
                    <img
                        class="restaurant_logo"
                        src="./assets/icons/burgerhouse_emblem.svg"
                        alt="Logo von BurgerHouse"
                    />
                </div>

                <div class="restaurant_info">
                    <div class="restaurant_title">
                        <h1 id="restaurant_name"><span>Burger</span>House</h1>
                        <p class="rating">
                            <img
                                src="./assets/icons/star.svg"
                                alt="Bewertung"
                            />
                            <strong>4,1</strong> (317)
                        </p>
                    </div>
                    <p class="slogan">
                        Das Beste aus Burgern, Pizza, Pasta und Salat an einem
                        Ort.
                    </p>
                    <p>Lieferkosten 4,99 € | Lieferzeit 30 bis 45 Minuten</p>
                </div>
            </section>

            <nav class="category_navigation" aria-label="Kategorien">
                <!-- renderCategoryLinks() renders the links into this list -->
                <ul id="category_links"></ul>
            </nav>

            <!-- renderCategories() renders the meals into this container -->
            <div id="meal_content"></div>
        </main>

        <footer>
            <div class="content_wrapper footer_content">
                <p class="copyright">
                    <img
                        src="./assets/icons/copyright.svg"
                        alt="Copyright"
                        width="20"
                        height="20"
                    />
                    2026 BurgerHouse
                </p>
                <a href="./impressum.html">Impressum</a>
                <a href="./impressum.html#cookies">Cookies</a>
            </div>
        </footer>
    </body>
</html>
