<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bestell App</title>
        <link rel="icon" href="./assets/icons/favicon.svg" />

        <script src="./scripts/templates.js"></script>
        <script src="./script.js"></script>

        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body onload="init()">
        <header>
            <div class="content_wrapper">
                <h1>
                    <a href="#">
                        <img
                            class="bestellapp-logo"
                            src="./assets/icons/bestellapp_logo.svg"
                            alt="Bestell App"
                        />
                    </a>
                </h1>
            </div>
        </header>

        <main class="content_wrapper">
            <!-- rendermeals() renders the meal cards into this container -->
            <div id="meal_content" class="meal_list"></div>
        </main>

        <footer>
            <div class="content_wrapper">
                <a href="#"
                    ><p>
                        <img
                            src="./assets/icons/copyright.svg"
                            alt="copyright"
                            width="14px"
                        />2025 BurgerHouse
                    </p></a
                >
                <a href="#"><p>Imprint</p></a>
                <a href="#"><p>Cookie Preferences</p></a>
            </div>
        </footer>
    </body>
</html>
